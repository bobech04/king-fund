<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>👑 KING FUND</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="header">
  <div class="logo">👑 KING FUND</div>
  <div class="battle-day" id="battle-day">J— / 30</div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-label">MISE</div>
    <div class="stat-value">500 €</div>
  </div>
  <div class="stat">
    <div class="stat-label">OBJECTIF</div>
    <div class="stat-value accent">10 000 €</div>
  </div>
  <div class="stat">
    <div class="stat-label">WINNERS</div>
    <div class="stat-value" id="winners-count">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">MAJ</div>
    <div class="stat-value muted" id="update-time">—</div>
  </div>
</div>

<div class="banner hidden" id="banner">⚠ WebSocket déconnecté — mode polling</div>

<main id="leaderboard"></main>

<!-- Trader detail modal -->
<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal">

    <div class="modal-header">
      <button class="btn-close" id="btn-close">✕</button>
      <div class="modal-title">
        <h2 class="modal-name" id="modal-name"></h2>
        <div class="modal-strategy" id="modal-strategy"></div>
      </div>
      <div class="modal-rank-badge" id="modal-rank-badge"></div>
    </div>

    <div class="modal-kpi">
      <div class="kpi-block">
        <div class="kpi-label">VALEUR</div>
        <div class="kpi-value" id="modal-value"></div>
      </div>
      <div class="kpi-block">
        <div class="kpi-label">P&amp;L</div>
        <div class="kpi-value" id="modal-pnl"></div>
      </div>
    </div>

    <div class="modal-progress-wrap">
      <div class="progress-labels">
        <span>500 €</span>
        <span id="modal-progress-pct"></span>
        <span>10 000 €</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="modal-progress"></div>
      </div>
    </div>

    <div class="modal-section">
      <div class="section-label">ÉVOLUTION</div>
      <div class="chart-container">
        <canvas id="modal-chart"></canvas>
      </div>
    </div>

    <div class="modal-section">
      <div class="section-label">POSITIONS</div>
      <div id="modal-positions"></div>
    </div>

    <div class="modal-section">
      <div class="section-label">DERNIERS TRADES</div>
      <div id="modal-trades"></div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
